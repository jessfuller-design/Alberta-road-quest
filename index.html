<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4058c7"><title>Andy’s Alberta Road Quest</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"></head>
<body><div id="app"></div>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#172033;--muted:#667085;--accent:#4058c7;--accent2:#e8ecff;--ok:#16794b;--bad:#b42318;--border:#d9dfec}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}button,select{font:inherit}button{touch-action:manipulation}.shell{max-width:820px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.brand{font-weight:800;font-size:1.2rem}.pill{display:inline-block;background:var(--accent2);color:#30439b;padding:6px 10px;border-radius:999px;font-size:.85rem}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(22,32,51,.05)}h1,h2,h3,p{margin-top:0}h1{font-size:1.55rem}h2{font-size:1.15rem}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.btn{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:14px;padding:13px;text-align:left;cursor:pointer;min-height:48px}.btn:hover{border-color:var(--accent)}.btn:focus-visible{outline:3px solid #9caafd;outline-offset:2px}.primary{background:var(--accent);color:#fff;border-color:var(--accent);text-align:center;font-weight:700}.answer{width:100%;margin:6px 0;min-height:52px}.answer.correct{border:2px solid var(--ok);background:#e9f8f0}.answer.wrong{border:2px solid var(--bad);background:#fff0ee}.progress{height:10px;background:#e8ebf2;border-radius:999px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;background:var(--accent)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.feedback{margin-top:12px;padding:12px;border-radius:12px;background:#f1f3f9}.big{font-size:2.2rem;font-weight:800}.stat{padding:12px;border:1px solid var(--border);border-radius:14px;text-align:center}.spot{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border)}.spot input{width:22px;height:22px}.footer{font-size:.78rem;color:var(--muted);margin-top:14px;text-align:center}.section{margin-top:22px}.topic-meta{display:block;font-size:.78rem;color:var(--muted);margin-top:3px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar .btn{min-height:40px;padding:9px 12px}select{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px;background:white;color:var(--text)}.meter{height:8px;background:#e8ebf2;border-radius:999px;overflow:hidden;margin-top:7px}.meter>span{display:block;height:100%;background:var(--accent)}.review-list{display:grid;gap:8px}.review-item{border:1px solid var(--border);border-radius:12px;padding:10px}.tiny{font-size:.78rem}@media(max-width:560px){.grid,.grid3{grid-template-columns:1fr}.shell{padding:11px}.card{padding:15px}.top{align-items:flex-start}}
</style>
<style>
.sign-art{display:flex;align-items:center;justify-content:center;min-height:178px;padding:8px}.sign-art svg{width:170px;height:170px;filter:drop-shadow(0 5px 5px rgba(23,32,51,.12))}.sign-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.sign-card{border:1px solid var(--border);border-radius:16px;padding:12px;background:#fff}.sign-card .sign-art{min-height:118px}.sign-card .sign-art svg{width:110px;height:110px}.sign-card h3{margin:4px 0}.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 10px;cursor:pointer}.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}.sign-choice{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:10px}.sign-choice .sign-art{min-height:64px;padding:0}.sign-choice .sign-art svg{width:62px;height:62px}@media(max-width:560px){.sign-grid{grid-template-columns:1fr}}
</style>
<style>
.match-board{display:grid;grid-template-columns:90px 1fr;gap:9px 12px}.match-column{display:grid;gap:8px;align-content:start}.match-btn{text-align:center;font-weight:800}.match-meaning{font-weight:500;text-align:left}.match-btn.selected,.match-meaning.selected{border:2px solid var(--accent);background:var(--accent2)}.match-btn.matched,.match-meaning.matched{border-color:var(--ok);background:#e9f8f0;color:var(--ok);opacity:.72}.memory-hook{display:block;margin-top:5px;color:#30439b;font-size:.82rem}@media(max-width:420px){.match-board{grid-template-columns:68px 1fr;gap:7px}.match-board .btn{padding:10px 8px}}
</style>
<script src="road-signs.js"></script>
<script src="questions.js"></script>
<script>
const QUESTIONS=window.ROADQUEST_QUESTIONS;
const DEFAULT={xp:0,best:0,missed:[],seen:0,correct:0,streak:0,bestStreak:0,stats:{},bookmarks:[]};
let state;
try{state=Object.assign(DEFAULT,JSON.parse(localStorage.getItem('andyDriveState')||'{}'))}catch(e){state={...DEFAULT}}
const app=document.getElementById('app');
function save(){try{localStorage.setItem('andyDriveState',JSON.stringify(state))}catch(e){}}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function header(){return `<div class="top"><div class="brand">Andy’s Alberta Road Quest</div><div class="pill">${state.xp} XP</div></div>`}
function masteryFor(indices){let attempts=0,correct=0;indices.forEach(i=>{const x=state.stats[i]||{};attempts+=x.attempts||0;correct+=x.correct||0});return attempts?Math.round(correct/attempts*100):0}
function home(){const cats=[...new Set(QUESTIONS.map(q=>q.cat))];const overall=state.seen?Math.round(state.correct/state.seen*100):0;app.innerHTML=`<div class="shell">${header()}<div class="card"><h1>Choose a mission</h1><p class="muted">Unlimited play. Everything works offline and progress stays on this device.</p><div class="grid"><button class="btn primary" data-mode="quick">Quick Play · 10</button><button class="btn primary" data-mode="exam">Mock Test · 30</button><button class="btn" data-mode="custom">Custom Quiz</button><button class="btn" data-mode="endless">Endless Mode</button><button class="btn" data-mode="missed">Retry all missed (${state.missed.length})</button><button class="btn" data-mode="bookmarks">Saved questions (${state.bookmarks.length})</button><button class="btn" data-mode="study">Flashcard Study</button><button class="btn" data-mode="codes">Licence Code Decoder</button><button class="btn" data-mode="spotter">Road Trip Spotter</button></div><div class="section"><h2>Practice a topic</h2><div class="grid">${cats.map(c=>{const ids=QUESTIONS.map((q,i)=>q.cat===c?i:-1).filter(i=>i>=0);return `<button class="btn cat" data-cat="${c}"><strong>${c}</strong><span class="topic-meta">${ids.length} questions · ${masteryFor(ids)}% mastery</span><div class="meter"><span style="width:${masteryFor(ids)}%"></span></div></button>`}).join('')}</div></div><div class="section"><h2>Progress</h2><div class="grid3"><div class="stat"><div class="big">${overall}%</div><div class="muted">Overall accuracy</div></div><div class="stat"><div class="big">${state.best}%</div><div class="muted">Best mock test</div></div><div class="stat"><div class="big">${state.bestStreak}</div><div class="muted">Best streak</div></div></div><div class="toolbar" style="margin-top:12px"><button id="details" class="btn">Detailed progress</button><button id="coverage" class="btn">Guide coverage</button><button id="reset" class="btn">Reset progress</button></div></div></div><div class="footer">Based on Alberta Driver’s Guide: Cars and Light Trucks, Spring 2026. Study practice only; not an official test.</div></div>`;
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>startMode(b.dataset.mode)));document.querySelectorAll('.cat').forEach(b=>b.addEventListener('click',()=>{const q=QUESTIONS.filter(x=>x.cat===b.dataset.cat);quiz(shuffle(q),b.dataset.cat)}));document.getElementById('details').addEventListener('click',progressPage);document.getElementById('coverage').addEventListener('click',coveragePage);document.getElementById('reset').addEventListener('click',()=>{if(confirm('Reset all XP, scores and missed questions?')){state={...DEFAULT,stats:{},missed:[],bookmarks:[]};save();home()}})}
function startMode(m){if(m==='quick')quiz(shuffle(QUESTIONS).slice(0,10),'Quick Play');if(m==='exam')quiz(shuffle(QUESTIONS).slice(0,30),'Mock Test',true);if(m==='custom')customPage();if(m==='endless')endless();if(m==='missed'){const qs=state.missed.map(i=>QUESTIONS[i]).filter(Boolean);quiz(shuffle(qs),'Missed Questions')}if(m==='bookmarks'){const qs=state.bookmarks.map(i=>QUESTIONS[i]).filter(Boolean);quiz(shuffle(qs),'Saved Questions')}if(m==='study')study();if(m==='codes')codeDecoder();if(m==='spotter')spotter()}
function customPage(){const cats=[...new Set(QUESTIONS.map(q=>q.cat))];app.innerHTML=`<div class="shell">${header()}<div class="card"><div class="row"><h1>Custom Quiz</h1><button id="home" class="btn">Home</button></div><label><strong>Topic</strong><select id="topic"><option value="all">All topics</option>${cats.map(c=>`<option>${c}</option>`).join('')}</select></label><label style="display:block;margin-top:14px"><strong>Number of questions</strong><select id="count"><option>5</option><option selected>10</option><option>20</option><option>30</option><option>50</option><option value="all">All available</option></select></label><button id="start" class="btn primary" style="width:100%;margin-top:16px">Start quiz</button></div></div>`;document.getElementById('home').addEventListener('click',home);document.getElementById('start').addEventListener('click',()=>{const t=document.getElementById('topic').value;let pool=t==='all'?QUESTIONS:QUESTIONS.filter(q=>q.cat===t);pool=shuffle(pool);const c=document.getElementById('count').value;if(c!=='all')pool=pool.slice(0,+c);quiz(pool,t==='all'?'Custom Quiz':t)})}
function record(idx,ok){state.seen++;state.stats[idx]=state.stats[idx]||{attempts:0,correct:0};state.stats[idx].attempts++;if(ok){state.correct++;state.stats[idx].correct++;state.xp+=10;state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);state.missed=state.missed.filter(x=>x!==idx)}else{state.xp+=2;state.streak=0;if(!state.missed.includes(idx))state.missed.push(idx)}save()}
function quiz(qs,title,isExam=false){if(!qs.length){alert('There are no questions in this set yet.');return home()}let n=0,score=0,locked=false;const ids=qs.map(q=>QUESTIONS.indexOf(q));function render(){const q=qs[n],idx=ids[n],saved=state.bookmarks.includes(idx);app.innerHTML=`<div class="shell">${header()}<div class="card"><div class="row"><span class="pill">${title}</span><span>${n+1} / ${qs.length}</span></div><div class="progress"><div class="bar" style="width:${(n/qs.length)*100}%"></div></div><div class="row"><h2 style="margin-bottom:8px">${q.q}</h2><button id="bookmark" class="btn tiny" aria-label="Save question">${saved?'★ Saved':'☆ Save'}</button></div><div id="answers">${q.a.map((x,i)=>`<button class="btn answer" data-i="${i}">${x}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div><button id="next" class="btn primary" style="display:none;width:100%;margin-top:12px">${n===qs.length-1?'See results':'Next question'}</button></div></div>`;locked=false;document.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>choose(+b.dataset.i)));document.getElementById('next').addEventListener('click',()=>{n++;n>=qs.length?finish():render()});document.getElementById('bookmark').addEventListener('click',()=>{state.bookmarks.includes(idx)?state.bookmarks=state.bookmarks.filter(x=>x!==idx):state.bookmarks.push(idx);save();render()})}
function choose(i){if(locked)return;locked=true;const q=qs[n],ok=i===q.correct;record(ids[n],ok);if(ok)score++;document.querySelectorAll('.answer').forEach((b,j)=>{if(j===q.correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong');b.disabled=true});document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>${ok?'Correct · +10 XP':'Not quite · +2 XP'}</strong><br>${q.why}</div>`;document.getElementById('next').style.display='block'}
function finish(){const pct=Math.round(score/qs.length*100);if(isExam&&pct>state.best){state.best=pct;save()}const rank=pct>=90?'Road Master':pct>=80?'Safe Navigator':pct>=70?'Rookie Driver':'Keep Practising';app.innerHTML=`<div class="shell">${header()}<div class="card" style="text-align:center"><div class="big">${pct}%</div><h1>${rank}</h1><p>${score} of ${qs.length} correct</p><div class="grid"><button id="again" class="btn primary">Play again</button><button id="missedNow" class="btn">Review missed</button><button id="home" class="btn">Home</button></div></div></div>`;document.getElementById('again').addEventListener('click',()=>quiz(shuffle(qs),title,isExam));document.getElementById('missedNow').addEventListener('click',()=>startMode('missed'));document.getElementById('home').addEventListener('click',home)}render()}
function endless(){let score=0,n=0;function next(){const q=QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)],idx=QUESTIONS.indexOf(q);app.innerHTML=`<div class="shell">${header()}<div class="card"><div class="row"><span class="pill">Endless · ${score} correct</span><button id="stop" class="btn">Finish</button></div><h2 style="margin-top:18px">${q.q}</h2>${q.a.map((x,i)=>`<button class="btn answer" data-i="${i}">${x}</button>`).join('')}<div id="feedback"></div><button id="next" class="btn primary" style="display:none;width:100%;margin-top:12px">Next</button></div></div>`;let locked=false;document.getElementById('stop').addEventListener('click',home);document.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>{if(locked)return;locked=true;const i=+b.dataset.i,ok=i===q.correct;record(idx,ok);n++;if(ok)score++;document.querySelectorAll('.answer').forEach((x,j)=>{if(j===q.correct)x.classList.add('correct');else if(j===i)x.classList.add('wrong');x.disabled=true});document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>${ok?'Correct':'Not quite'}</strong><br>${q.why}</div>`;document.getElementById('next').style.display='block'}));document.getElementById('next').addEventListener('click',next)}next()}
function study(){let deck=shuffle(QUESTIONS),n=0,shown=false;function render(){const q=deck[n];app.innerHTML=`<div class="shell">${header()}<div class="card"><div class="row"><span class="pill">Flashcards</span><span>${n+1} / ${deck.length}</span></div><h2 style="margin-top:20px">${q.q}</h2><div id="answer" class="feedback" style="display:${shown?'block':'none'}"><strong>${q.a[q.correct]}</strong><br>${q.why}</div><div class="grid" style="margin-top:14px"><button id="show" class="btn primary">${shown?'Hide answer':'Show answer'}</button><button id="next" class="btn">Next card</button><button id="home" class="btn">Home</button></div></div></div>`;document.getElementById('show').addEventListener('click',()=>{shown=!shown;render()});document.getElementById('next').addEventListener('click',()=>{n=(n+1)%deck.length;shown=false;render()});document.getElementById('home').addEventListener('click',home)}render()}
const LICENCE_CODES={conditions:[['A','Adequate lenses'],['B','Special conditions'],['C','Periodic medical'],['D','Periodic vision report'],['E','Periodic driver examination'],['F','Valid temporary licence'],['G','Temporary resident'],['H','Daylight driving only'],['J','Outside mirrors'],['K','Automatic transmission'],['L','Hand controls'],['M','Under Transportation and Economic Corridors review'],['N','Excludes Class 2 and 4'],['P','Testing by Provincial Examiner only'],['T','Special medical']],endorsements:[['Q','Air brakes'],['S','School bus'],['U','Completed driver education course'],['V','Extended-length vehicle combinations']]};
const CODE_HOOKS={A:'A = Aid for eyesight',B:'B = Bespoke special rule',C:'C = Checkup with medical staff',D:'D = Doctor checks vision',E:'E = Examination again',F:'F = For now: temporary licence',G:'G = Guest or temporary resident',H:'H = Hours of daylight',J:'J = Just outside mirrors',K:'K = Keeps it automatic',L:'L = Levers controlled by hand',M:'M = Ministry review',N:'N = No Classes 2 or 4',P:'P = Provincial examiner',T:'T = Tailored special medical',Q:'Q = Air cue: picture air filling the Q',S:'S = School bus',U:'U completed driver education',V:'V = Very long vehicle combination'};
function codeDecoder(){const list=(title,items)=>`<div class="section"><h2>${title}</h2><div class="review-list">${items.map(([code,meaning])=>`<div class="review-item row"><span class="pill"><strong>${code}</strong></span><span>${meaning}<span class="memory-hook">Memory hook: ${CODE_HOOKS[code]}</span></span></div>`).join('')}</div></div>`;app.innerHTML=`<div class="shell">${header()}<div class="card"><div class="row"><h1>Licence Code Decoder</h1><button id="home" class="btn">Home</button></div><p class="muted">These are the 19 condition and endorsement codes listed in the official Spring 2026 Alberta Driver’s Guide. Alberta does not publish which exact questions will appear on an individual test.</p><div class="feedback"><strong>Condition = limitation or requirement</strong><br><strong>Endorsement = added training or permission</strong></div><div class="grid" style="margin-top:14px"><button id="match" class="btn primary">Match 6 code pairs</button><button id="practice" class="btn primary">Practice 5 questions</button></div><div class="feedback"><strong>Use the hook, then say the real meaning</strong><br>The hook starts the memory; the official meaning finishes it.</div>${list('15 condition codes',LICENCE_CODES.conditions)}${list('4 endorsement codes',LICENCE_CODES.endorsements)}</div></div>`;document.getElementById('home').addEventListener('click',home);document.getElementById('practice').addEventListener('click',codePractice);document.getElementById('match').addEventListener('click',codeMatching)}
function codePractice(){const all=[...LICENCE_CODES.conditions,...LICENCE_CODES.endorsements],rounds=shuffle(all).slice(0,5);let n=0,score=0;function render(){if(n>=rounds.length){app.innerHTML=`<div class="shell">${header()}<div class="card" style="text-align:center"><div class="big">${score} / ${rounds.length}</div><h1>Code round complete</h1><div class="grid"><button id="again" class="btn primary">Play again</button><button id="reference" class="btn">Code reference</button><button id="home" class="btn">Home</button></div></div></div>`;document.getElementById('again').addEventListener('click',codePractice);document.getElementById('reference').addEventListener('click',codeDecoder);document.getElementById('home').addEventListener('click',home);return}const target=rounds[n],reverse=Math.random()<.5,others=shuffle(all.filter(x=>x[0]!==target[0])).slice(0,3),choices=shuffle([target,...others]);const prompt=reverse?`Which code means “${target[1]}”?`:`What does code ${target[0]} mean?`;app.innerHTML=`<div class="shell">${header()}<div class="card"><div class="row"><span class="pill">Code Decoder</span><span>${n+1} / ${rounds.length}</span></div><h2 style="margin-top:18px">${prompt}</h2><div id="answers">${choices.map(x=>`<button class="btn answer" data-code="${x[0]}">${reverse?x[0]:x[1]}</button>`).join('')}</div><div id="feedback"></div><button id="next" class="btn primary" style="display:none;width:100%;margin-top:12px">${n===rounds.length-1?'See result':'Next code'}</button></div></div>`;let locked=false;document.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>{if(locked)return;locked=true;const ok=b.dataset.code===target[0];if(ok){score++;state.xp+=5}else state.xp+=1;save();document.querySelectorAll('.answer').forEach(x=>{if(x.dataset.code===target[0])x.classList.add('correct');else if(x===b)x.classList.add('wrong');x.disabled=true});document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>${ok?'Correct · +5 XP':'Not quite · +1 XP'}</strong><br>${target[0]} = ${target[1]}</div>`;document.getElementById('next').style.display='block'}));document.getElementById('next').addEventListener('click',()=>{n++;render()})}render()}
function codeMatching(){const all=[...LICENCE_CODES.conditions,...LICENCE_CODES.endorsements],pairs=shuffle(all).slice(0,6),codes=shuffle(pairs),meanings=shuffle(pairs);let selectedCode=null,selectedMeaning=null,matched=[],score=0,status='Choose one letter and one meaning.';function render(){if(matched.length===pairs.length){app.innerHTML=`<div class="shell">${header()}<div class="card" style="text-align:center"><div class="big">${score} / ${pairs.length}</div><h1>Matching round complete</h1><p class="muted">Say each pair aloud once before starting another round.</p><div class="grid"><button id="again" class="btn primary">New 6-pair round</button><button id="codes" class="btn">Code reference</button><button id="home" class="btn">Home</button></div></div></div>`;document.getElementById('again').addEventListener('click',codeMatching);document.getElementById('codes').addEventListener('click',codeDecoder);document.getElementById('home').addEventListener('click',home);return}app.innerHTML=`<div class="shell">${header()}<div class="card"><div class="row"><h1>Code Matching</h1><button id="codes" class="btn">Code reference</button></div><p class="muted">Match all six. The letter order and meaning order change every round.</p><div class="match-board"><div class="match-column">${codes.map(([code])=>`<button class="btn match-btn ${matched.includes(code)?'matched':''} ${selectedCode===code?'selected':''}" data-code="${code}" ${matched.includes(code)?'disabled':''}>${code}</button>`).join('')}</div><div class="match-column">${meanings.map(([code,meaning])=>`<button class="btn match-meaning ${matched.includes(code)?'matched':''} ${selectedMeaning===code?'selected':''}" data-meaning="${code}" ${matched.includes(code)?'disabled':''}>${meaning}</button>`).join('')}</div></div><div class="feedback" id="matchStatus">${status}</div><div class="topic-meta" style="margin-top:8px">${matched.length} of ${pairs.length} matched</div></div></div>`;document.getElementById('codes').addEventListener('click',codeDecoder);document.querySelectorAll('[data-code]').forEach(b=>b.addEventListener('click',()=>{selectedCode=b.dataset.code;check()}));document.querySelectorAll('[data-meaning]').forEach(b=>b.addEventListener('click',()=>{selectedMeaning=b.dataset.meaning;check()}))}function check(){if(selectedCode&&selectedMeaning){if(selectedCode===selectedMeaning){matched.push(selectedCode);score++;state.xp+=5;status=`Correct: ${selectedCode} = ${pairs.find(x=>x[0]===selectedCode)[1]} · +5 XP`}else{state.xp+=1;status=`Not a match. Try another pair · +1 XP`}selectedCode=null;selectedMeaning=null;save()}render()}render()}
function progressPage(){const cats=[...new Set(QUESTIONS.map(q=>q.cat))];app.innerHTML=`<div class="shell">${header()}<div class="card"><div class="row"><h1>Detailed progress</h1><button id="home" class="btn">Home</button></div><div class="review-list">${cats.map(c=>{const ids=QUESTIONS.map((q,i)=>q.cat===c?i:-1).filter(i=>i>=0),m=masteryFor(ids),attempted=ids.filter(i=>(state.stats[i]?.attempts||0)>0).length;return `<div class="review-item"><div class="row"><strong>${c}</strong><span>${m}%</span></div><div class="meter"><span style="width:${m}%"></span></div><div class="topic-meta">${attempted} of ${ids.length} questions attempted</div></div>`}).join('')}</div></div></div>`;document.getElementById('home').addEventListener('click',home)}

function coveragePage(){const chapters=[
['1. Licensing Information',['Licensing']],
['2. Traffic Control',['Signals','Signs & Speed','Zones']],
['3. The Basics of Driving',['Driving Basics','Parking']],
['4. Intersections and Turns',['Intersections']],
['5. Highways and Freeways',['Highways']],
['6. Emergencies and Challenging Conditions',['Hazards']],
['7. Responsible Driving',['Responsible Driving']],
['8. Sharing the Road',['Sharing the Road']],
['9. Driving Within the Law',['Law & Fitness']],
['10. Towing a Trailer',['Towing']]
];app.innerHTML=`<div class="shell">${header()}<div class="card"><div class="row"><h1>Guide coverage</h1><button id="home" class="btn">Home</button></div><p class="muted">Every chapter of the Spring 2026 guide is represented. Question counts show the current bank, not a promise that every sentence in the guide appears as a separate question.</p><div class="review-list">${chapters.map(([name,cats])=>{const count=QUESTIONS.filter(q=>cats.includes(q.cat)).length;return `<div class="review-item"><div class="row"><strong>${name}</strong><span>${count} questions</span></div><div class="topic-meta">${cats.join(' · ')}</div></div>`}).join('')}</div><div class="feedback" style="margin-top:14px"><strong>${QUESTIONS.length} total questions</strong><br>Use Custom Quiz → All available for a full-bank run.</div></div></div>`;document.getElementById('home').addEventListener('click',home)}

function spotter(){const items=['Stop sign','Yield sign','School or playground sign','Construction sign','Pedestrian crossing','Merge sign','Cyclist','Large truck blind spot','Hidden driveway or blocked view','Driver following too closely','Railway crossing','Vehicle signalling a lane change','Emergency vehicle','Snowplow or road-maintenance vehicle'];app.innerHTML=`<div class="shell">${header()}<div class="card"><div class="row"><h1>Road Trip Spotter</h1><button id="home" class="btn">Home</button></div><p class="muted">Passenger activity only. Complete this mission as many times as you like.</p>${items.map((x,i)=>`<label class="spot"><input type="checkbox" data-i="${i}"><span>${x}</span></label>`).join('')}<div id="spotResult" class="feedback">0 of ${items.length} spotted</div><button id="restart" class="btn" style="width:100%;margin-top:12px">Start a new round</button></div></div>`;document.getElementById('home').addEventListener('click',home);document.getElementById('restart').addEventListener('click',spotter);let awarded=false;document.querySelectorAll('input[type=checkbox]').forEach(x=>x.addEventListener('change',()=>{const done=document.querySelectorAll('input:checked').length;document.getElementById('spotResult').textContent=`${done} of ${items.length} spotted`;if(done===items.length&&!awarded){awarded=true;state.xp+=50;save();document.getElementById('spotResult').innerHTML='<strong>Mission complete · +50 XP</strong>'}}))}
const SIGNS=window.ROADQUEST_SIGNS;
state.signStats=state.signStats||{};
function signArt(sign){
  const isOrange=sign.palette.includes('Orange'),isBlue=sign.palette.includes('Blue'),isFluorescent=sign.palette.includes('Fluorescent'),isRed=sign.palette.includes('Red');
  let fill=isOrange?'#f59e0b':isBlue?'#1769aa':isFluorescent?'#d8ff38':sign.id==='stop'?'#c8202f':'#ffd83d';
  let stroke=isRed?'#c8202f':'#161616',text=(isBlue||sign.id==='stop')?'#fff':'#111',shape='';
  if(sign.shape==='Octagon')shape=`<polygon points="58,10 122,10 170,58 170,122 122,170 58,170 10,122 10,58"/>`;
  else if(sign.shape==='Triangle')shape=`<polygon points="90,170 10,25 170,25"/>`;
  else if(sign.shape==='Diamond')shape=`<polygon points="90,8 172,90 90,172 8,90"/>`;
  else if(sign.shape==='Pentagon')shape=`<polygon points="90,8 170,65 140,170 40,170 10,65"/>`;
  else if(sign.shape==='Circle')shape=`<circle cx="90" cy="90" r="76"/>`;
  else if(sign.shape==='Rectangle')shape=`<rect x="8" y="38" width="164" height="104" rx="5"/>`;
  else shape=`<rect x="18" y="18" width="144" height="144" rx="5"/>`;
  if(sign.id==='do-not-enter'){fill='#c8202f';text='#fff'}
  if(sign.cat==='Prohibitory'){fill='#fff';stroke='#c8202f'}
  if(sign.palette==='White and black'){fill='#fff';stroke='#111'}
  const lines=sign.glyph.split('\n'),font=lines.some(x=>x.length>8)?15:lines.length>1?20:sign.glyph.length>6?18:34;
  const labels=lines.map((line,i)=>`<text x="90" y="${90+(i-(lines.length-1)/2)*24}" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,sans-serif" font-size="${font}" font-weight="800" fill="${text}">${line}</text>`).join('');
  const slash=sign.prohibitory&&sign.id!=='do-not-enter'?`<line x1="35" y1="145" x2="145" y2="35" stroke="#c8202f" stroke-width="13"/>`:'';
  return `<div class="sign-art" role="img" aria-label="${sign.name} sign"><svg viewBox="0 0 180 180" aria-hidden="true"><g fill="${fill}" stroke="${stroke}" stroke-width="8" stroke-linejoin="round">${shape}</g>${labels}${slash}</svg></div>`;
}
function signMastery(){const attempted=SIGNS.filter(s=>(state.signStats[s.id]?.attempts||0)>0).length,correct=Object.values(state.signStats).reduce((n,x)=>n+(x.correct||0),0),tries=Object.values(state.signStats).reduce((n,x)=>n+(x.attempts||0),0);return {attempted,accuracy:tries?Math.round(correct/tries*100):0}}
function recordSign(id,ok){state.signStats[id]=state.signStats[id]||{attempts:0,correct:0};state.signStats[id].attempts++;if(ok){state.signStats[id].correct++;state.xp+=7}else state.xp+=1;save()}
function signLab(){const m=signMastery();app.innerHTML=`<div class="shell">${header()}<div class="card"><div class="row"><h1>Road Sign Lab</h1><button id="home" class="btn">Home</button></div><p class="muted">Learn the sign’s picture, shape, colour, meaning, and the action it requires.</p><div class="grid"><button id="recognize" class="btn primary">Recognize signs · 10</button><button id="shapeQuiz" class="btn primary">Shape & colour · 10</button><button id="flash" class="btn">Sign flashcards</button><button id="library" class="btn">Browse all ${SIGNS.length} signs</button></div><div class="section"><h2>Sign progress</h2><div class="grid"><div class="stat"><div class="big">${m.attempted}</div><div class="muted">Signs attempted</div></div><div class="stat"><div class="big">${m.accuracy}%</div><div class="muted">Sign accuracy</div></div></div></div><div class="feedback"><strong>Shape shortcut</strong><br>Octagon = stop · upside-down triangle = yield · pentagon = school · yellow diamond = warning · orange diamond = construction</div></div></div>`;document.getElementById('home').addEventListener('click',home);document.getElementById('recognize').addEventListener('click',()=>signQuiz('recognize'));document.getElementById('shapeQuiz').addEventListener('click',()=>signQuiz('category'));document.getElementById('flash').addEventListener('click',signFlashcards);document.getElementById('library').addEventListener('click',()=>signLibrary('All'))}
function signLibrary(filter='All'){const cats=['All',...new Set(SIGNS.map(s=>s.cat))],shown=filter==='All'?SIGNS:SIGNS.filter(s=>s.cat===filter);app.innerHTML=`<div class="shell">${header()}<div class="card"><div class="row"><h1>Sign Library</h1><button id="back" class="btn">Sign Lab</button></div><div class="chip-row">${cats.map(c=>`<button class="chip ${c===filter?'active':''}" data-cat="${c}">${c}</button>`).join('')}</div><p class="muted">${shown.length} signs</p><div class="sign-grid">${shown.map(s=>`<article class="sign-card">${signArt(s)}<h3>${s.name}</h3><div class="topic-meta">${s.shape} · ${s.palette}</div><p class="tiny" style="margin-top:9px">${s.meaning}</p><div class="feedback tiny"><strong>Driver action:</strong> ${s.action}</div></article>`).join('')}</div></div></div>`;document.getElementById('back').addEventListener('click',signLab);document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>signLibrary(b.dataset.cat)))}
function signQuiz(mode){const deck=shuffle(SIGNS).slice(0,10);let n=0,score=0;function render(){if(n>=deck.length){app.innerHTML=`<div class="shell">${header()}<div class="card" style="text-align:center"><div class="big">${score} / ${deck.length}</div><h1>Sign round complete</h1><div class="grid"><button id="again" class="btn primary">Play again</button><button id="lab" class="btn">Sign Lab</button><button id="home" class="btn">Home</button></div></div></div>`;document.getElementById('again').addEventListener('click',()=>signQuiz(mode));document.getElementById('lab').addEventListener('click',signLab);document.getElementById('home').addEventListener('click',home);return}const target=deck[n];let answers,correctText;if(mode==='recognize'){answers=shuffle([target,...shuffle(SIGNS.filter(s=>s.id!==target.id)).slice(0,3)]).map(s=>s.name);correctText=target.name}else{const options=[...new Set(SIGNS.map(s=>s.cat))];answers=shuffle([target.cat,...shuffle(options.filter(x=>x!==target.cat)).slice(0,3)]);correctText=target.cat}app.innerHTML=`<div class="shell">${header()}<div class="card"><div class="row"><span class="pill">${mode==='recognize'?'Recognize the sign':'Shape & colour'}</span><span>${n+1} / ${deck.length}</span></div>${signArt(target)}<h2>${mode==='recognize'?'What sign is this?':'Which sign family does this belong to?'}</h2><div id="answers">${answers.map(x=>`<button class="btn answer" data-value="${x}">${x}</button>`).join('')}</div><div id="feedback"></div><button id="next" class="btn primary" style="display:none;width:100%;margin-top:12px">${n===deck.length-1?'See result':'Next sign'}</button></div></div>`;let locked=false;document.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>{if(locked)return;locked=true;const ok=b.dataset.value===correctText;if(ok)score++;recordSign(target.id,ok);document.querySelectorAll('.answer').forEach(x=>{if(x.dataset.value===correctText)x.classList.add('correct');else if(x===b)x.classList.add('wrong');x.disabled=true});document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>${ok?'Correct · +7 XP':'Not quite · +1 XP'}</strong><br>${target.name}: ${target.meaning}<br><span class="tiny">${target.shape} · ${target.palette}</span></div>`;document.getElementById('next').style.display='block'}));document.getElementById('next').addEventListener('click',()=>{n++;render()})}render()}
function signFlashcards(){const deck=shuffle(SIGNS);let n=0,shown=false;function render(){const s=deck[n];app.innerHTML=`<div class="shell">${header()}<div class="card"><div class="row"><span class="pill">Sign flashcards</span><span>${n+1} / ${deck.length}</span></div>${signArt(s)}<div id="signAnswer" class="feedback" style="display:${shown?'block':'none'}"><h2>${s.name}</h2><div class="topic-meta">${s.shape} · ${s.palette}</div><p style="margin-top:10px">${s.meaning}</p><strong>Driver action:</strong> ${s.action}</div><div class="grid" style="margin-top:14px"><button id="show" class="btn primary">${shown?'Hide answer':'Reveal sign'}</button><button id="next" class="btn">Next sign</button><button id="lab" class="btn">Sign Lab</button></div></div></div>`;document.getElementById('show').addEventListener('click',()=>{shown=!shown;render()});document.getElementById('next').addEventListener('click',()=>{n=(n+1)%deck.length;shown=false;render()});document.getElementById('lab').addEventListener('click',signLab)}render()}
const originalStartMode=startMode;startMode=function(mode){if(mode==='signs')signLab();else originalStartMode(mode)};
const originalHome=home;home=function(){originalHome();const quick=document.querySelector('[data-mode="quick"]');if(quick){const signs=document.createElement('button');signs.className='btn primary';signs.dataset.mode='signs';signs.textContent=`Road Sign Lab · ${SIGNS.length}`;signs.addEventListener('click',signLab);quick.insertAdjacentElement('afterend',signs)}};
home();
</script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');</script></body></html>
